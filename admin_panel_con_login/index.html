<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEC-EVENTOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body>
    <div id="registerForm" class="container p-2">
        <div class="card">
            <div class="card-body">
                <form id="registroForm" onsubmit="return false;"> <!-- ID para el registro -->
                    <h1 id="registraTitulo" class="text-center">Regístrate</h1>
                    <div class="form-group">
                        <label for="registerName">Añade tu nombre</label>
                        <input type="text" class="form-control" id="registerName" placeholder="Nombre">
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Añade tu correo</label>
                        <input type="email" class="form-control" id="registerEmail" placeholder="Correo">
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Añade una contraseña</label>
                        <input type="password" class="form-control" id="registerPassword" placeholder="Contraseña">
                    </div>
                    <div class="form-group">
                        <label for="repeatPassword">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="repeatPassword" placeholder="Contraseña">
                    </div>
                    <div id="errorContraseña" class="text-danger d-none">Las contraseñas no coinciden.</div>
                    <br>
                    <button type="submit" class="form-control btn btn-success">Registrar</button>
                    <div class="d-flex align-items-center justify-content-center pb-4">
                        <p class="mb-0 me-2">¿Ya tienes cuenta?</p>
                        <button type="button" class="btn btn-link text-decoration-none" id="cambiarALogin">
                            Inicia sesión
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="loginForm" class="container p-2 d-none" >
        <div class="card">
            <div class="card-body">
                <form id="formLogin" onsubmit="return false;">
                    <h1 id="loginTitulo" class="text-center">Inicio de sesión</h1>
                    <div class="form-group">
                        <label for="loginName">Añade tu nombre</label>
                        <input type="text" class="form-control" id="loginName" placeholder="Nombre">
                    </div>
                    <div class="form-group">
                        <label for="loginEmail">Añade tu correo</label>
                        <input type="email" class="form-control" id="loginEmail" placeholder="Correo">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Introduce tu contraseña</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña">
                        <i class='bx bxs-low-vision'></i>
                    </div>
                    <br>
                    <button type="submit" class="form-control btn btn-success">Iniciar sesión</button>
                    <div class="d-flex align-items-center justify-content-center pb-4">
                        <p class="mb-0 me-2">¿No tienes cuenta?</p>
                        <button type="button" class="btn btn-link text-decoration-none" id="cambiarARegistro">
                            Regístrate
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
</body>
</html>
