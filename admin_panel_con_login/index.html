<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEC-EVENTOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <div class="container1">
    <div class=" p-5 row justify-content-md-center">
      <div class="card" style="width: 25rem;">
          <div class="card-body">
              <form>
                  <h1 class="text-center">Inicio de sesión</h1>
                  <div class="form-group">
                    <label for="exampleInputEmail1">Añade tu correo</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Correo">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">Introduce tu contraseña</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Contraseña">
                    <i class='bx bxs-low-vision'></i>
                  </div>
                  <br>
                  <button type="submit" class="form-control btn btn-success">Iniciar sesión</button>
                  <div class="d-flex align-items-center justify-content-center pb-4">
                    <p class="mb-0 me-2">¿No tienes cuenta?</p>
                    <button id="btnShow" class="btn btn-link text-decoration-none" onclick="ShowHide()">
                      Registrate
                    </button>
                    
                  </div>
              </form>
          </div>
        </div>
      </div>
    </div>
    <div class="container2 p-5 row justify-content-md-center">
      <div class="card" style="width: 25rem;">
          <div class="card-body">
              <form>
                  <h1 class="text-center">Registrate</h1>
                  <div class="form-group">
                    <label for="exampleInputEmail1">Añade tu correo</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Correo">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">Añade una contraseña</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Contraseña">
                  </div>
                  <div class="form-group">
                      <label for="exampleInputPassword1">Confirmar contraseña</label>
                      <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Contraseña">
                    </div>
                  <br>
                  <button type="submit" class="form-control btn btn-success">Registrar</button>
                  <div class="d-flex align-items-center justify-content-center pb-4">
                    <p class="mb-0 me-2">¿Ya tienes cuenta?</p>
                    <button id="btnShow" class="btn btn-link text-decoration-none" onclick="ShowHide()">
                      Inicia sesión
                    </button>
                  </div>
              </form>
          </div>
        </div>
      </div>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
